<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 105 260 285" width="100%" height="100%">
  <defs>
    <!-- Application Brand Palette Gradients (Material You Indigo / Lavender) -->
    <linearGradient id="c4b-robot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3edff" />
      <stop offset="25%" stop-color="#d0bcff" />
      <stop offset="65%" stop-color="#6350a7" />
      <stop offset="100%" stop-color="#381e72" />
    </linearGradient>

    <filter id="c4b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="c4b-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- MASCOT GROUP: UNIFIED SHADOW FILTER PREVENTS INTERNAL SEAM LINES -->
  <g id="c4b-mascot" transform="translate(250, 245)" filter="url(#c4b-shadow)">
    <!-- Y-TORSO & STEM -->
    <path d="M -15 -25 
             C -35 25, -65 80, -95 115 
             C -105 128, -90 140, -75 135 
             C -35 120, 15 70, 35 15 
             C 45 -10, 25 -35, -15 -25 Z" 
          fill="url(#c4b-robot)" />

    <!-- Left Branch of the "Y" (Mirrored Symmetrical Arm — Sin Laptop) -->
    <path d="M -22 8 
             C -50 2, -85 -15, -108 -45 
             C -116 -56, -105 -64, -94 -56 
             C -66 -40, -32 -18, -5 -3 Z" 
          fill="url(#c4b-robot)" />

    <!-- Right Branch of the "Y" -->
    <path d="M 22 8 
             C 50 2, 85 -15, 108 -45 
             C 116 -56, 105 -64, 94 -56 
             C 66 -40, 32 -18, 5 -3 Z" 
          fill="url(#c4b-robot)" />

    <!-- ROBOT HEAD with Compact Cyber Beacon (Sin antena larga, sin sonrisa, visor tecnológico limpio) -->
    <g transform="translate(-50, -125)">
      <!-- Compact Cyber Beacon Integrated on Dome Ridge -->
      <rect x="44" y="0" width="12" height="5" rx="2.5" fill="#4f378a" stroke="#d0bcff" stroke-width="1.2" />
      <circle cx="50" cy="-1" r="4" fill="#d0bcff" filter="url(#c4b-glow)" />
      <circle cx="50" cy="-1" r="1.8" fill="#ffffff" />

      <!-- Audio Pods -->
      <rect x="-14" y="28" width="14" height="30" rx="7" fill="#4f378a" stroke="#d0bcff" stroke-width="1.5" />
      <rect x="100" y="28" width="14" height="30" rx="7" fill="#4f378a" stroke="#d0bcff" stroke-width="1.5" />
      
      <!-- Head Dome (Gradiente puro, sin borde blanco - Flat Tech) -->
      <rect x="-2" y="4" width="104" height="78" rx="39" fill="url(#c4b-robot)" />

      <!-- Sunglasses / Visor Tecnológico Limpio (Visor Puro / Sin Boca) -->
      <path d="M 10 33 Q 50 40 90 33 L 88 52 Q 50 62 12 52 Z" fill="#141b2b" stroke="#6350a7" stroke-width="1.8" />
      <line x1="22" y1="44" x2="78" y2="44" stroke="#d0bcff" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
